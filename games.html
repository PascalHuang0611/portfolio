<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>17 款遊戲總覽 ｜ 黃培昇</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --ink:#1b1b1b; --ink2:#555; --ink3:#8a8a8a; --line:#e3e2de;
    --job:#2f6fb5; --job-bg:#e9f1fb; --job-soft:#b9d2ee; --dead:#9a9a9a;
    --s1:#2f6fb5; --s2:#4f8fd0; --s3:#7db0e0; --s4:#b9d2ee; --s5:#dbe7f5; --s6:#8a8a8a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.7}
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 28px 60px}
  .back{font-size:13.5px;color:var(--ink2);text-decoration:none}
  .back:hover{color:var(--ink)}
  h1{font-size:24px;margin:10px 0 4px;font-weight:600}
  .sub{color:var(--ink2);margin:0 0 18px;font-size:14px;max-width:820px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .filters button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
  .filters button.on{background:var(--job);border-color:var(--job);color:#fff}
  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:900px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
  th{font-size:12.5px;color:var(--ink2);font-weight:600;background:#fafaf8;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  td.n{font-weight:500;white-space:nowrap}
  td.m{color:var(--ink2);font-size:12.5px}
  .role{font-size:11.5px;border-radius:999px;padding:0 7px;white-space:nowrap;border:1px solid var(--job-soft);background:var(--job-bg);color:var(--job)}
  .role.lead{background:#f1f5fa;color:#1d3f66}
  .role.dead{background:#f3f3f3;border-color:#ddd;color:var(--dead)}
  .role.dv{background:#fff;color:var(--ink2);border-color:var(--line)}
  h2{font-size:19px;margin:36px 0 4px;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;border-top:4px solid var(--job)}
  .card.lead{border-top-color:var(--job-soft)} .card.dead{border-top-color:#bbb}
  .card h3{margin:0;font-size:15.5px;font-weight:600}
  .card .meta{font-size:12.5px;color:var(--ink2);margin:2px 0 8px}
  .card p{margin:0 0 6px;font-size:13.5px}
  .card .todo{font-size:12px;color:var(--ink3);margin-top:8px}
  .feature{grid-column:1/-1;display:grid;grid-template-columns:220px 1fr;gap:22px}
  .feature img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
  .feature .cap{font-size:11.5px;color:var(--ink3);margin-top:4px;text-align:center}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px;margin:8px 0 10px}
  .kv b{color:var(--ink2);font-weight:600;white-space:nowrap}
  .kan{background:#fafaf8;border-left:3px solid var(--job);padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:13.5px}
  .kan b{display:block;margin-bottom:2px}
  .bar{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
  .bar span{display:block;height:100%}
  .lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .deliv{font-size:13px;color:var(--ink2)}
  .deliv code{font-family:inherit;background:#f1f1ee;border-radius:4px;padding:0 5px}
  footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink3);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  @media (max-width:900px){.cards{grid-template-columns:1fr}.feature{grid-template-columns:1fr}.feature img{max-width:240px;margin:0 auto}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← 回首頁</a>
<h1>17 款遊戲總覽</h1>
<p class="sub">17 款上線（含 3 款衍生版）加 5 款完成設計但未上線。每款核心數學約一週完成，之後跟到上線。表格看全貌，卡片看每一款怎麼做、怎麼驗、花了多少小時。公開版不放實際 RTP、機率表與參數。</p>

<div class="filters" id="filters">
  <button data-f="all" class="on">全部</button>
  <button data-f="solo">獨立完成</button>
  <button data-f="lead">帶領團隊成員</button>
  <button data-f="dv">衍生版</button>
  <button data-f="dead">完成設計、未上線</button>
</div>

<div class="tablewrap">
<table id="tbl">
  <thead><tr><th>遊戲</th><th>類型</th><th>動手月份</th><th>上線</th><th>角色</th><th>核心數學</th><th>驗證方式</th><th>工時</th></tr></thead>
  <tbody></tbody>
</table>
</div>

<h2>卡片</h2>
<p class="sub">先完成 Color Game 作為模板，其餘依序補齊。</p>
<div class="cards" id="cards"></div>

<footer>
  <span>公開版 ｜ 遊戲畫面為對外公開的產品畫面；不含任何實際參數與玩家資料。</span>
  <span>最後更新 2026/09</span>
</footer>
</div>

<script>
// k: solo 獨立 / lead 帶領團隊成員 / dv 衍生版 / dead 完成設計未上線
const G = [
 {code:"TG103", n:"Color Game", alt:"ColorRoll", k:"solo", type:"電子類 · 三色骰押六色 + JP 二級玩法", work:"2025/07（小迭代至 09）", launch:"2026/02/09；2026/06/24 下架", math:"主池派彩、副池為鑰匙的雙池 JP；JP 中獎率隨押注對門檻的倍數放大，格權重由目標機率反推", verify:"Excel 建模 + JSON 產生器；C++ 六策略各十億局，驗證 JP 派彩趨近抽水率", hours:30, feature:true},
 {code:"TG001", n:"LiveMines", k:"solo", type:"視訊實體機台 · 九宮格踩地雷", work:"2025/07–08、12；2026/04、05、08–09", launch:"2026/08/10", math:"實體落球分布不可控，RTP 調節放在可控變數；三層風控", verify:"C++/Go 十億局、三跑同種子；真實注單萃取 DNA、沙盤回放；GLI 送審", hours:"201.5+"},
 {code:"TG102", n:"Pula Puti", k:"solo", type:"電子類 · 紅白落球", work:"2025/07", launch:"2025/12/17", math:"重建既有數學、加成系統設計", verify:"C++ 模擬、每日 RTP 分布", hours:21},
 {code:"TG104", n:"Drop Ball", k:"solo", type:"電子類 · 六色三球", work:"2025/07（V1–V4）、09（V5）、11（V6）", launch:"2026/02/09；Flash 06/17；Color Flash 08/20", math:"五個玩法分支演進到雙模式 Extra Bet", verify:"共同亂數法雙軌模擬器，理論版與模擬版對照", hours:58.5},
 {code:"TG105", n:"BingBing Run", k:"solo", type:"電子類 · 十層左右選路 crash", work:"2025/07", launch:"2026/02/09；Mega 06/17", math:"RTP 差額資助寶箱；三級 JP 動態權重與同步回補", verify:"C++ 十億局；JP 機制最佳模型搜尋 20h", hours:40},
 {code:"TG106", n:"Cash Bingo", k:"solo", type:"電子類 · 四軸數字拼接老虎機", work:"2025/06；2025/12 重作模型", launch:"2026/06/17", math:"Bet 級距各一張全排列權重表", verify:"MD5 版控、自架 Go 測試伺服器交叉比對", hours:54},
 {code:"TG110", n:"Lucky Coins", k:"solo", type:"電子類 · Cash Bingo 同架構", work:"2026/04", launch:"2026/06/17", math:"Cash Bingo 小改參數", verify:"同 Cash Bingo 流程", hours:"—"},
 {code:"TG120", n:"Apolaki", k:"lead", type:"電子類 · Cash Bingo + ExBet", work:"2026/07", launch:"2026/09/03", math:"加 ExBet：第四軸不出空白、提升特殊符號機率", verify:"團隊成員製作、我審核", hours:"—"},
 {code:"TG108", n:"Piggy Crash", k:"solo", type:"電子類 · 620 關離散階梯 crash", work:"2026/01", launch:"2026/06/17", math:"常數期望值系統；PM 網頁配置器", verify:"配置器即時驗算 + 模擬", hours:"—"},
 {code:"TG114", n:"Pinoy Rush", k:"solo", type:"電子類 · Piggy Crash 衍生", work:"2026/03", launch:"2026/08/20", math:"同框架衍生", verify:"同 Piggy Crash 流程", hours:"—"},
 {code:"TG111", n:"Chicken Run", k:"lead", type:"電子類 · 選路 crash", work:"2025/12–2026/02", launch:"2026/06/17", math:"團隊成員製作；審核抓到衝刺功能 RTP 漏算，接手修正後上線", verify:"審核與驗算", hours:"—"},
 {code:"TG112", n:"Pinoy Hi-Lo", k:"lead", type:"電子類 · 比大小", work:"2026/03–05；05、07 接手修正", launch:"2026/08/10", math:"團隊成員製作；抽牌條件機率誤寫為獨立事件，接手修正", verify:"審核與驗算；截斷賠率模擬報表", hours:"—"},
 {code:"TG113", n:"Chicky Tower", k:"solo", type:"電子類 · 九層塔 crash", work:"2026/01；2026/08 上線後修正", launch:"2026/06/17", math:"多層提現賠率結構", verify:"上線後持續稽核與參數修正", hours:"—"},
 {code:"TG117", n:"Chicky Mines", k:"solo", type:"電子類 · 5×5 踩地雷", work:"2026/01（前身 LuckyMines 2025/07）", launch:"2026/06/17", math:"表裡機率雙層模型：顯示賠率隨鑽石上漲、真實勝率由目標 RTP 反推", verify:"C++ 模擬；名目 / 有效 RTP 分開驗", hours:"24（前身）"},
 {code:"—", n:"BingBing Run Mega", k:"dv", type:"衍生版 · 多關卡", work:"2026/06", launch:"2026/06/17", math:"上線前一週參數調整", verify:"—", hours:"—"},
 {code:"—", n:"Drop Ball Flash", k:"dv", type:"衍生版 · 參數調整、畫面優化", work:"2026/06", launch:"2026/06/17", math:"上線前一週參數調整", verify:"—", hours:"—"},
 {code:"—", n:"Color Flash", k:"dv", type:"衍生版 · Drop Ball Flash 換皮", work:"2026/08", launch:"2026/08/20", math:"上線前一週參數調整", verify:"—", hours:"—"},
 {code:"TG107", n:"BingoSlot", k:"dead", type:"逆向生成引擎", work:"2025/11–12", launch:"未上線", math:"結果導向：先抽獎金再生成盤面；K-Grow、零超發、損耗補償", verify:"SDK 封裝 C API 供 Go 整合，模擬數據測試", hours:252},
 {code:"—", n:"SlotBingo 錄製抽盤", k:"dead", type:"錄盤架構原型", work:"2025/10", launch:"未單獨採用；2026/09 併入風控水位系統", math:"離線海量生成 + 線上權重抽樣", verify:"數學 / 後端雙重驗證", hours:62},
 {code:"—", n:"LuckyMines", k:"dead", type:"電子類 · 踩地雷 JP", work:"2025/07", launch:"暫緩 → Chicky Mines", math:"推敲 JP 系統規則、建模", verify:"模擬器 + 驗證", hours:24},
 {code:"—", n:"Hi-Lo 第一版", k:"dead", type:"電子類 · 比大小", work:"2025/07", launch:"未通過 → Pinoy Hi-Lo", math:"建模", verify:"模擬器 + 驗證", hours:12},
 {code:"—", n:"Plinko 系列", k:"dead", type:"電子類 · 三變體", work:"2026/03", launch:"未上線", math:"純 Plinko、分裂、免費球", verify:"—", hours:"—"},
];
const ROLE = {solo:"獨立完成", lead:"帶領團隊成員", dv:"衍生版", dead:"未上線"};

const tb=document.querySelector("#tbl tbody"), cards=document.getElementById("cards");
function render(f){
  tb.innerHTML=""; cards.innerHTML="";
  G.filter(g=>f==="all"||g.k===f).forEach(g=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="n">${g.n}${g.alt?`<br><span class="m">${g.alt}</span>`:""}</td><td class="m">${g.type}</td><td class="m">${g.work}</td><td class="m">${g.launch}</td><td><span class="role ${g.k}">${ROLE[g.k]}</span></td><td>${g.math}</td><td class="m">${g.verify}</td><td class="m">${g.hours}${typeof g.hours==="number"?"h":""}</td>`;
    tb.appendChild(tr);
    const c=document.createElement("div"); c.className="card "+g.k+(g.feature?" feature":"");
    if(g.feature){
      c.innerHTML=`
        <div><img src="素材/遊戲總覽/TG103_ColorRoll/截圖/主畫面.png" alt="Color Game 主畫面"><div class="cap">主畫面：三色骰、六色押注區、Color Jackpot 解鎖門檻</div></div>
        <div>
          <h3>Color Game <span style="font-weight:400;color:var(--ink2);font-size:13px">ColorRoll ｜ TG103</span></h3>
          <div class="meta">電子類 · 三色骰押六色，三同色觸發 JP 二級玩法 ｜ 獨立完成 ｜ 2025/07 設計 → 2026/02/09 上線 → 2026/06/24 下架</div>
          <div class="kv">
            <b>核心數學</b><span>主池派彩、副池為隱藏鑰匙的雙池 JP，達門檻才啟動；JP 中獎率隨「總押注 ÷ 門檻」等比放大，格權重由目標機率反推。</span>
            <b>驗證方式</b><span>Excel 建模含 JSON 產生器與權重反推；C++ 模擬器六種押注策略各十億局，驗證 JP 實際派彩趨近抽水率。</span>
            <b>特點</b><span>JP 的 RTP 定義為抽水率，期望值不隨玩家行為漂移；多人同局第一人中 JP 後副池歸零。</span>
          </div>
          <div class="kan"><b>這款的坎：中 JP 全拿，怎麼讓大小注公平</b>PM 要能控制發出的獎金額，所以派彩走主池、副池當鑰匙，達門檻才開 JP。PM 又希望中 JP 可以全拿，如果轉輪上的 JP 中獎率固定，壓小注的人就有優勢。解法是讓中獎率依「總押注 ÷ JP 門檻」等比放大：門檻 10，押 100 的人中 JP 的機率是押 10 的人的 10 倍，每個注額的期望值一樣。</div>
          <div><b style="font-size:13px;color:var(--ink2)">工時 30 小時</b>（V1 11h ＋ 追加 JP 的 V2 19h，2025 年當時紀錄）
            <div class="bar"><span style="width:6.7%;background:var(--s1)" title="理解規則 2h"></span><span style="width:20%;background:var(--s2)" title="建立數學模型 6h"></span><span style="width:20%;background:var(--s3)" title="模擬器 6h"></span><span style="width:26.6%;background:var(--s4)" title="驗證與模擬 8h"></span><span style="width:13.3%;background:var(--s5)" title="規則文件 4h"></span><span style="width:13.3%;background:var(--s6)" title="開發時數值修改與驗證 4h"></span></div>
            <div class="lg"><span><i style="background:var(--s1)"></i>理解規則 2</span><span><i style="background:var(--s2)"></i>建模 6</span><span><i style="background:var(--s3)"></i>模擬器 6</span><span><i style="background:var(--s4)"></i>驗證與模擬 8</span><span><i style="background:var(--s5)"></i>規則文件 4</span><span><i style="background:var(--s6)"></i>開發時修改 4</span></div>
          </div>
          <p class="deliv" style="margin-top:10px">交付物：<code>數學原理與規則解析 V3.2</code> <code>ColorWheels_Math_V3.2.xlsx</code> <code>config.json</code> <code>C++ 模擬器</code> <code>模擬報表</code>；上線後小迭代五次（2025/07/21 – 09/09）。</p>
        </div>`;
    } else {
      c.innerHTML=`<h3>${g.n} <span style="font-weight:400;color:var(--ink2);font-size:12.5px">${g.code!=="—"?g.code:""}</span></h3>
        <div class="meta">${g.type} ｜ ${ROLE[g.k]} ｜ ${g.work} → ${g.launch}</div>
        <p>${g.math}</p><p style="color:var(--ink2);font-size:13px">${g.verify}</p>
        ${typeof g.hours==="number"?`<p style="color:var(--ink2);font-size:13px">工時 ${g.hours}h（2025 年紀錄）</p>`:""}
        <div class="todo">截圖與細節補齊中</div>`;
    }
    cards.appendChild(c);
  });
}
document.querySelectorAll("#filters button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render(b.dataset.f);}));
render("all");
</script>
</body>
</html>
