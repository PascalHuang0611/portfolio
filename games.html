  kan:[["實體落球的結果跟數學理論值有明顯偏差","落球是真實的物理結果。實機測試時發現結果跟理論值差距明顯，例如兩球落同一格那一項的 RTP 明顯偏高，照理論算出來的模型必須修正。"],["落球有偏向性，不是永遠均勻分布","物理落球會偏向某些格子，而且偏向不是固定的。用均勻分布算出來的 RTP 代表不了上線後的實際風險；PM 需要在改數值或辦活動之前，先知道在真實的物理雜訊下可能發生什麼。"]],

  kv:[["核心數學","傳統 crash 玩法。倍率不是先抽一個死亡點，而是關卡制：每一小段時間以高成功率進下一關、直到失敗，倍率隨關卡累積。任何一關下車的期望值都一樣（常數期望值系統），沒有「只抓低倍」或「永遠追高」的策略優勢；關卡數可以無限延長而不需要改數學模型。"],["驗證方式","C++ 步進模擬器跑多種下車策略（固定倍率、永不下車、隨機區間）對照期望值是否一致；Excel 建模。另做一個給 PM 的網頁配置器：自行設定各區間機率、即時試算、倍率曲線圖、內建試玩、一鍵輸出 JSON。"],["特點","一款遊戲的框架，衍生出 Pinoy Rush 等同型遊戲，只換演出與參數。"]],
  kan:[["倍率怎麼產生：先抽死亡點，還是逐關過關","兩種做法：一是先決定這一局的死亡倍率、玩家不知道、自己決定何時下車；二是關卡制，每一小段時間以高成功率進下一關直到失敗。同類型最紅的那一款，倍率分布看起來是第二種做出來的。要選哪一種、為什麼。"],["自動下車的倍率不在關卡表上，怎麼結算","關卡制的倍率是一張離散的表。玩家設定的自動下車倍率如果剛好不在表上，這一局算成功還是失敗、以哪個倍率結算，要定一條規則。"]],
  hrs:[["理解規則",2],["建模",2],["模擬器",2],["DEMO／配置器",4],["規則文件",2],["後續修改（最終賠率）",3]], hrsNote:"15 小時，其中 4 小時在 PM 配置器",

 {code:"TG111", n:"Chicken Run", alt:"", k:"lead", type:"電子類 · 選路 crash（四難度、含衝刺與錢袋、JP 雙池）", work:"2025/12–2026/02（團隊成員製作、我審核）", launch:"2026/06/17", math:"四難度各不同關數、每難度多組 RTP 檔位；衝刺功能一次前進 1～3 步，其期望值必須納入模型", verify:"逐關驗算表與模擬器對照；每份設定檔附 MD5 與報表；審核時抓到衝刺 RTP 漏算，重做模型", hours:"—", feature:true, hasAfter:true,

  kv:[["核心數學","選路 crash：每關單關成功率、累積過關率、雷率與賠率逐關對應，四種難度關數不同，每個難度再分多組 RTP 檔位，合計二十份設定檔各附 MD5 與報表。衝刺功能一次前進 1～3 步，等於跳過中間關卡的風險，它的機率分布必須納入每關的期望值。另有錢袋倍率與 JP 主副池。"],["驗證方式","團隊成員製作，我逐關審核驗算表、對照模擬器輸出；設定檔以 MD5 對齊 DevOps 流程。"],["特點","這是帶一位沒有經驗的團隊成員做的第一款。審核時發現第一版模型漏了衝刺對 RTP 的影響，整份重做，我陪著加了兩天班一起做完。"]],
  kan:[["衝刺功能會讓 RTP 變高，第一版模型沒算進去","衝刺一次前進 1～3 步，玩家跳過了中間關卡的雷，過關率和賠率的對應就變了。第一版把衝刺當演出處理，沒有納入期望值，整體 RTP 會高於目標。這是在審核階段發現的，不是上線後。"],["帶一個沒有經驗的人做第一款，審核要審到哪一層","不能只看最後的 RTP 數字對不對，要看每一個機制的期望值有沒有被獨立算出來、有沒有被加總。"],["AI 加速了產出，也讓審核變難","團隊成員用 AI 輔助建模，文件與公式看起來完整、格式正確、解釋流暢，錯誤也同樣完整。審核的人不能再靠「看起來對不對」，要有另一套判斷依據。"]],

 {code:"TG112", n:"Pinoy Hi-Lo", alt:"", k:"lead", type:"電子類 · 撲克高低牌，多回合連押，Bonus 與 Mini 觸發", work:"2026/03–05（團隊成員製作、我審核）；05、07 接手修正", launch:"2026/08/10", math:"多回合高低牌，每回合勝率取決於當前牌面；保守策略與各策略的 RTP 對照；每一回合的當前牌就是上一回合抽出的牌，第二回合起的勝率取決於上一回合的結果", verify:"百億次模擬；接手後修正兩個錯誤並重出報表；設定檔對齊 DevOps 的 MD5 流程", hours:16, feature:true, hasAfter:true,
  img:"素材/遊戲總覽/TG112_PinoyHiLo/截圖/TG112_主畫面.png", cap:"主畫面",

  kv:[["核心數學","多回合高低牌：每回合押高或低，勝率取決於當前牌面，連押累積賠率；另有 Bonus 與 Mini 觸發。每一回合的當前牌就是上一回合抽出的那張，所以第二回合起的勝率取決於上一回合的結果，不能每一回合都當第一局算。以保守策略（每回合選高勝率的一邊）與多種策略對照 RTP。"],["驗證方式","團隊成員製作、我審核；百億次模擬對照試算表。我平常就要求團隊成員把設計文件寫齊，所以成員離職後有文件可以重現設計思路、程式也有交接。接手後先跑舊模擬器重現舊報表，再讀模型與程式，修正兩個錯誤、重出報表。前身是 2025/07 我自己做的 Hi-Lo 第一版（未通過）。"],["特點","帶人做的第二款。第一款（Chicken Run）審核抓到的是期望值漏算，這一款抓到的是回合之間的狀態沒有延續（每一回合都被當成第一局算），兩種不同類型的錯。"]],
  kan:[["QA 說第二回合起的勝率會隨前一張牌變，這是不是 bug","上線前 QA 實測發現第二回合之後的勝率跟前一局的牌有關，與文件寫的固定勝率對不上。RTP 看起來沒有問題，那勝率為什麼對不上，問題在文件、在模擬器、還是在遊戲？"],["文件和程式都在，但兩邊對不上時，哪一個才是對的","接手離職成員的模型：設計文件有、程式也有，讀的時候發現文件裡有一條公式跟程式算的不一樣。要判斷是文件寫錯還是程式寫錯，不能兩個都信、也不能兩個都不信。兩個修正合計 16 小時。"]],
  hrs:[["接手：理解模型與程式、重寫、修正兩個錯誤、重出報表",16]], hrsNote:"16 小時（接手修正）；團隊成員製作階段未計",

 {code:"TG113", n:"Chicky Tower", k:"solo", type:"電子類 · 九層塔 crash", work:"2026/01；2026/08 上線後修正", launch:"2026/06/17", math:"九層塔每層三格；收費放在入場，之後每一層的期望值相同，任何一層停手長期回報一致；賠率由第九層往回推", verify:"C++ OpenMP 模擬器批次跑三種難度、每種一億局，固定停手點（點擊 1~9 次）的 RTP 都收斂；上線後補做依盤面決策的策略模擬", hours:"—", feature:true, hasAfter:true,
  img:"素材/遊戲總覽/TG113_ChickyTower/截圖/TG113_主畫面.png", cap:"主畫面",
  sub:"電子類 · 九層塔 crash，通關觸發 JP 轉輪 ｜ 獨立完成 ｜ 2026/01 → 2026/06/17 上線；2026/08 上線後自查與修正",
  kv:[["核心數學","九層、每層三格（普通星、衝刺星、錢袋、炸彈），盤面在下注後一次生成，玩家可以隨時停手，通關第九層觸發 JP 轉輪。收費放在入場：入場先收掉 RTP 差額，之後每一層的期望值都相同，所以玩家不論在哪一層停手，長期回報都一樣。賠率用雙軌逆推，從第九層往回算結構價值與現金成本。"],["驗證方式","C++ OpenMP 模擬器自動掃描三種難度的設定檔批次跑，每種一億局，輸出每個停手點的存活率、RTP、波動與 JP 命中率，跟理論值逐項對照：固定停手點（點擊 1~9 次）的 RTP 都收斂在目標值。上線後補做另一類模擬——玩家依照看到的盤面改變決策。"],["特點","同一套塔樓框架可以出三種盤面尺寸與三種難度，換參數就是另一款；JP 沿用 Chicky 系列的雙池與動態權重。上線後的自我稽核抓到一個設計時沒想到的問題，見「坎與回看」。"]],
  kan:[["玩家要看得到特殊層，又要能自由決定何時收手，這兩個條件同時成立就有套利空間","兩個條件當初是分開想的：特殊層（衝刺、錢袋）要看得到才有期待感；隨時可以收手是這類玩法的基本規則。漏掉的是兩者同時成立的情況——玩家可以依照看到的盤面決定要不要繼續，長期回報就會偏離設計值。"],["模擬只跑了固定的停手點，沒跑「看到什麼就改變決策」的策略","當時的驗證是模擬點擊 1~9 次每一種停手點，RTP 全部收斂在目標值，所以判定沒問題。缺的正是這款會出事的那一類：依可見資訊改變決策的條件策略。"]],

 {code:"TG117", n:"Chicky Mines", k:"solo", type:"電子類 · 5×5 踩地雷", work:"2026/01（前身 LuckyMines 2025/07）", launch:"2026/06/17", math:"表裡兩層：畫面上的賠率隨鑽石往上走，真實存活率由目標 RTP 反推，再逐步換成條件機率", verify:"C++ 模擬器跑 20 種雷數各十億局；聚寶盆的名目與有效 RTP 分開驗", hours:"24（前身）", feature:true,

  kv:[["核心數學","玩家自選 1~20 顆雷，逐格翻開累積賠率，隨時可以停手。設計成表裡兩層：表層是玩家看到的賠率，踩到鑽石格會永久往上加，做出「越玩越賺」的體感；裡層是真正的存活率，由目標 RTP 除以當下的顯示賠率反推，再換算成每一步的條件存活率。顯示賠率再怎麼漂亮，長期回報都被鎖在目標值上。另有兩種彩金：紅聚寶盆是小額即時獎，藍聚寶盆沿用 Chicky 系列的雙池 JP。"],["驗證方式","C++ 模擬器對 20 種雷數各跑十億局，逐一對照 Mines RTP、聚寶盆與總 RTP，並輸出波動係數——雷數從 1 到 20，波動差了數百倍。Excel 另做逐步對照表，把每一步的表面賠率、真實勝率與偏差並排檢查。"],["特點","紅聚寶盆的名目 RTP 與有效 RTP 分開報。這個獎要活到隨機的觸發步數才算領到，雷數越多越容易提前出局，實際拿到的比名目低很多，所以兩個數字都列，成本不用名目值估。"]],
  kan:[["表賠率要先照機制設計出來，裡賠率再逆推回去，設計順序跟傳統 Mines 相反","傳統 Mines 是直接擺固定數量的金幣和炸彈，盤面擺好、機率就定了。這款反過來：先依機制設計出玩家看得到的表賠率（鑽石會把它往上推），再從目標 RTP 逆推出裡層真正的成功率。順序一反，整套模型要重寫，這是我做過比較麻煩的一款。"],["真實成功率是算出來的、不是擺出來的，伺服器與 QA 都不好處理","沒有固定盤面可以對照：每一步的存活率要由演算法即時算出來。伺服器要照這套演算法實作，溝通成本比一般款高；QA 也沒有現成的盤面可核對，驗測方式得另外定。這是這款落地時最大的挑戰。"]],

  const PR=priv(g);
  const nK=g.kan?g.kan.length:0, nA=(PR.after||g.hasAfter)?1:0;
  const tabs=(g.feature&&(nK>0||nA>0))?`<div class="tabs"><button data-t="ov" class="${TAB==="ov"?"on":""}">概要</button><button data-t="kan" class="${TAB==="kan"?"on":""}">坎與回看 <span style="color:var(--ink3);font-weight:400">${nK}${nA?"+"+nA:""}</span></button></div>`:"";
  return `<h3>${g.n} <span style="font-weight:400;color:var(--ink2);font-size:13px">${g.alt||""} ｜ ${g.code!=="—"?g.code:""}</span></h3>
    <div class="meta">${g.feature?g.sub:`${g.type} ｜ ${ROLE[g.k]} ｜ ${g.work} → ${g.launch}`}</div>${tabs}`;
}
function imgHTML(g){
  if(!g.feature) return "";
  if(!g.img) return `<div class="ph">主畫面截圖待補</div>`;
  return `<img src="${g.img}" alt="${g.n} 主畫面" title="${g.cap||''}" onerror="this.outerHTML='<div class=ph>主畫面截圖待補</div>'">`;
}
function bodyHTML(g){
  if(g.feature){
    const PR=priv(g);
    const hasKanTab=(g.kan&&g.kan.length>0)||PR.after||g.hasAfter;
    if(TAB==="kan"&&hasKanTab){
      const kan=g.kan.map(([t,b],i)=>`<div class="kan"><b>這款的坎：${t}</b>${b}${PR.sol&&PR.sol[i]?`<p class="sol"><b>解法</b>${PR.sol[i]}</p>`:`<p class="sol more">解法：完整版</p>`}</div>`).join("");
      const after=PR.after?`<div class="kan after"><b>上線後回看</b>${PR.after}</div>`:(g.hasAfter?`<div class="kan after more"><b>上線後回看</b>完整版</div>`:"");
      return `${kan}${after}<p class="pubnote">解法與上線後回看在完整版。</p>`;
    }
    const kv=g.kv.map(([k,v])=>`<b>${k}</b><span>${v}</span>`).join("");
    const deliv=g.deliv.map(d=>`<code>${d}</code>`).join(" ");
    return `<div class="kv">${kv}</div><p class="deliv" style="margin-top:10px">交付物：${deliv}；${g.deliv_note}</p><p class="pubnote">數學文件、試算表與模擬報表公開版只列名稱。</p>`;
  }
  return `<div class="compact">
    <p>${g.math}</p><p style="color:var(--ink2);font-size:13px">${g.verify}</p>
    ${typeof g.hours==="number"?`<p style="color:var(--ink2);font-size:13px">工時 ${g.hours}h <span style="color:var(--ink3);font-size:12px">自行粗估、時程自管</span></p>`:""}
    <div class="todo">截圖與細節補齊中</div></div>`;
}
function footHTML(g){
  if(!g.feature) return "";
  if(!g.hrs) return `<div><b style="font-size:13px;color:var(--ink2)">工時</b> <span style="font-size:12px;color:var(--ink3)">${g.hrsNote||"未記錄"}</span></div>`;
  const tot=g.hrs.reduce((a,b)=>a+b[1],0);
  const bar=g.hrs.map((h,i)=>`<span style="width:${(h[1]/tot*100).toFixed(1)}%;background:${COL[i%COL.length]}" title="${h[0]} ${h[1]}h"></span>`).join("");
  const lg=g.hrs.map((h,i)=>`<span><i style="background:${COL[i%COL.length]}"></i>${h[0]} ${h[1]}</span>`).join("");
  return `<div><b style="font-size:13px;color:var(--ink2)">工時 ${g.hrsNote}</b> <span style="font-size:12px;color:var(--ink3)">自行粗估、時程自管</span><div class="bar">${bar}</div><div class="lg">${lg}</div></div>`;
}
function openAt(i){
  CUR=i; const g=VIEW[i]; mbox.className="box "+g.k+(g.feature?" feat":"");
  mhead.innerHTML=headHTML(g); mimg.innerHTML=imgHTML(g); mmid.classList.toggle("nofig",!g.feature);
  mbody.innerHTML=bodyHTML(g); mbody.scrollTop=0; mfoot.innerHTML=footHTML(g); mpos.textContent=`${i+1} / ${VIEW.length}`;
  mhead.querySelectorAll(".tabs button").forEach(b=>b.onclick=function(){TAB=b.dataset.t; try{localStorage.setItem("pf_tab",TAB)}catch(e){} openAt(CUR);});
  document.querySelectorAll("#tbl tbody tr[data-i]").forEach(tr=>tr.classList.toggle("sel",Number(tr.dataset.i)===i));
  modal.classList.add("on"); document.body.style.overflow="hidden";
}
function closeM(){ modal.classList.remove("on"); document.body.style.overflow=""; }
document.getElementById("mclose").onclick=closeM;
modal.addEventListener("click",e=>{ if(e.target===modal) closeM(); });
document.addEventListener("keydown",e=>{ if(!modal.classList.contains("on")) return; if(e.key==="Escape") closeM(); if(e.key==="ArrowRight") openAt(Math.min(VIEW.length-1,CUR+1)); if(e.key==="ArrowLeft") openAt(Math.max(0,CUR-1)); });
document.getElementById("mprev").onclick=()=>openAt(Math.max(0,CUR-1));
document.getElementById("mnext").onclick=()=>openAt(Math.min(VIEW.length-1,CUR+1));
const FAM=[
 {id:"live",  label:"視訊實體機台", desc:"實體落球、GLI 送審、三層風控",            names:["LiveMines"]},
 {id:"slot",  label:"老虎機系列",   desc:"Cash Bingo 一家三款，可互相對照的實驗",     names:["Cash Bingo","Lucky Coins","Apolaki"]},
 {id:"chicky",label:"選路 crash 系列", desc:"左右選路、金幣、寶箱、多級 JP；含帶人作品與前身", names:["BingBing Run","BingBing Run Mega","Chicky Tower","Chicky Mines","Chicken Run","LuckyMines"]},
 {id:"ball",  label:"落球與色彩系列", desc:"紅白落球、六色三球、三色骰；含換皮衍生",     names:["Lucky Drop Ball","Drop Ball Flash","Color Flash","Pula Puti Flash","Color Game"]},
 {id:"crash", label:"關卡制 crash",  desc:"離散關卡取代連續曲線，一個框架多款",         names:["Piggy Crash","Pinoy Rush"]},
 {id:"poker", label:"撲克",         desc:"高低牌；帶人作品與第一版",                   names:["Pinoy Hi-Lo","Hi-Lo 第一版"]},
 {id:"engine",label:"老虎機引擎與未上線", desc:"結果導向逆向生成、錄製抽盤、Plinko",     names:["BingoSlot","SlotBingo 錄製抽盤","Plinko 系列"]},
];
function famOf(g){ for(const f of FAM){ const i=f.names.indexOf(g.n); if(i>=0) return [f,i]; } return [FAM[FAM.length-1],99]; }
function render(f){
  tb.innerHTML="";
  const list=G.filter(g=>f==="all"||(f==="todo"?!g.feature:g.k===f));
  list.sort((a,b)=>{ const [fa,ia]=famOf(a),[fb,ib]=famOf(b); const da=FAM.indexOf(fa)-FAM.indexOf(fb); return da!==0?da:ia-ib; });
  VIEW=list;
  let lastFam=null;
  VIEW.forEach((g,i)=>{
    const [fam]=famOf(g);
    if(fam!==lastFam){
      const h=document.createElement("tr"); h.className="grp-row f-"+fam.id;
      h.innerHTML=`<td colspan="8"><b>${fam.label}</b><span>${fam.desc}</span></td>`;
      tb.appendChild(h); lastFam=fam;
    }
    const tr=document.createElement("tr"); tr.className="f-"+fam.id; tr.dataset.i=i;
    tr.innerHTML=`<td class="n">${g.n}${g.feature?"":' <span class="todo-tag">待補</span>'}${g.alt?`<br><span class="m">${g.alt}</span>`:""}</td><td class="m">${g.type}</td><td class="m">${g.work}</td><td class="m">${g.launch}</td><td><span class="role ${g.k}">${ROLE[g.k]}</span></td><td>${g.math}</td><td class="m">${g.verify}</td><td class="m">${g.hours}${typeof g.hours==="number"?"h":""}</td>`;
    tr.addEventListener("click",()=>openAt(i));
    tb.appendChild(tr);
  });
}
document.querySelectorAll("#filters button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#filters button").forEach(x=>x.classList.remove("on"));b.classList.add("on");render(b.dataset.f);}));
render("all");
(function(){var d=G.filter(function(g){return g.feature}).length;var el=document.getElementById("donecount");if(el)el.textContent=d+" / "+G.length;})();
</script>
</body>
</html>
